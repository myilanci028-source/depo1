name: MUBEL KANTAR UNIVERSAL 2.10.9-R04 APK

on:
  push:
    branches: [mubel-kantar-r04-release]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Extract R04 source
        shell: bash
        run: |
          rm -rf mubel-kantar-r04/project
          mkdir -p mubel-kantar-r04/project
          tar -xzf mubel-kantar-r04/source.tar.gz -C /tmp
          cp -a /tmp/MUBEL_Kantar_Android_R04/. mubel-kantar-r04/project/
          grep -n "applicationId\|versionCode\|versionName" mubel-kantar-r04/project/app/build.gradle

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: mubel-kantar-r04/project
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK archive
        shell: bash
        run: |
          set -euo pipefail
          APK='mubel-kantar-r04/project/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -t "$APK"
          mkdir -p mubel-kantar-r04/dist
          cp "$APK" mubel-kantar-r04/dist/MUBEL_KANTAR_UNIVERSAL_2.10.9-R04.apk
          sha256sum mubel-kantar-r04/dist/MUBEL_KANTAR_UNIVERSAL_2.10.9-R04.apk | tee mubel-kantar-r04/dist/SHA256.txt

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Android 16 emulator install + double-launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -eu
            APK='mubel-kantar-r04/dist/MUBEL_KANTAR_UNIVERSAL_2.10.9-R04.apk'
            REPORT='mubel-kantar-r04/dist/SMOKE_REPORT.txt'
            : > "$REPORT"
            echo '=== INSTALL ===' | tee -a "$REPORT"
            adb install -r "$APK" | tee -a "$REPORT"
            adb shell pm path com.mubel.kantar.r04 | tee -a "$REPORT"

            echo '=== COLD LAUNCH #1 ===' | tee -a "$REPORT"
            adb logcat -c
            adb shell am force-stop com.mubel.kantar.r04
            adb shell am start -W -n com.mubel.kantar.r04/.MainActivity | tee -a "$REPORT"
            sleep 6
            PID1="$(adb shell pidof com.mubel.kantar.r04 | tr -d '\r')"
            echo "PID1=$PID1" | tee -a "$REPORT"
            test -n "$PID1"
            adb shell uiautomator dump /sdcard/mubel_window.xml >/dev/null
            adb pull /sdcard/mubel_window.xml mubel-kantar-r04/dist/UI_DUMP_1.xml >/dev/null
            grep -q 'MUBEL KANTAR UNIVERSAL' mubel-kantar-r04/dist/UI_DUMP_1.xml
            if adb logcat -d | grep -q 'Process: com.mubel.kantar.r04'; then
              adb logcat -d > mubel-kantar-r04/dist/CRASH_LOG.txt
              cat mubel-kantar-r04/dist/CRASH_LOG.txt
              exit 1
            fi
            adb exec-out screencap -p > mubel-kantar-r04/dist/SMOKE_SCREEN_1.png

            echo '=== FORCE STOP + RELAUNCH #2 ===' | tee -a "$REPORT"
            adb shell am force-stop com.mubel.kantar.r04
            sleep 1
            adb shell am start -W -n com.mubel.kantar.r04/.MainActivity | tee -a "$REPORT"
            sleep 6
            PID2="$(adb shell pidof com.mubel.kantar.r04 | tr -d '\r')"
            echo "PID2=$PID2" | tee -a "$REPORT"
            test -n "$PID2"
            adb shell uiautomator dump /sdcard/mubel_window2.xml >/dev/null
            adb pull /sdcard/mubel_window2.xml mubel-kantar-r04/dist/UI_DUMP_2.xml >/dev/null
            grep -q 'MUBEL KANTAR UNIVERSAL' mubel-kantar-r04/dist/UI_DUMP_2.xml
            if adb logcat -d | grep -q 'Process: com.mubel.kantar.r04'; then
              adb logcat -d > mubel-kantar-r04/dist/CRASH_LOG.txt
              cat mubel-kantar-r04/dist/CRASH_LOG.txt
              exit 1
            fi
            adb exec-out screencap -p > mubel-kantar-r04/dist/SMOKE_SCREEN_2.png
            echo 'SMOKE_TEST=PASS' | tee -a "$REPORT"

      - uses: actions/upload-artifact@v4
        with:
          name: MUBEL_KANTAR_UNIVERSAL_2.10.9-R04_ANDROID16_TESTED
          path: |
            mubel-kantar-r04/dist/MUBEL_KANTAR_UNIVERSAL_2.10.9-R04.apk
            mubel-kantar-r04/dist/SHA256.txt
            mubel-kantar-r04/dist/SMOKE_REPORT.txt
            mubel-kantar-r04/dist/SMOKE_SCREEN_1.png
            mubel-kantar-r04/dist/SMOKE_SCREEN_2.png
            mubel-kantar-r04/dist/UI_DUMP_1.xml
            mubel-kantar-r04/dist/UI_DUMP_2.xml
          if-no-files-found: error
          retention-days: 30
