name: MUBEL KANTAR UNIVERSAL 2.10.8-R03 APK

on:
  push:
    branches: [mubel-kantar-r03-release]
    paths:
      - 'mubel-kantar-r03/**'
      - '.github/workflows/mubel-kantar-r03-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild and verify R03 source archive
        shell: bash
        run: |
          echo 'd20234c6f904750872106ab40f7266d0a49449fe16ddb02848c97720ddd6b70b  mubel-kantar-r03/source.part00' | sha256sum -c -
          echo '4e9012905fb8a36c4bdd831d4c73149d71059d2663c223537fa9387534363dd1  mubel-kantar-r03/source.part01' | sha256sum -c -
          echo 'd28d28bc0adccd5508dc140615321c69e0c6e42f2a77a088deaafbb3f461a42e  mubel-kantar-r03/source.part02' | sha256sum -c -
          echo '395b42f3eda1f39d231e16750134809f1e090e33834932a6e7e448f8f63bc239  mubel-kantar-r03/source.part03a' | sha256sum -c -
          echo '895c64e17321d0c8e6ad0511bb12b0d8a3d4d33398cc12fbe127181d3b85e3a6  mubel-kantar-r03/source.part03b' | sha256sum -c -
          echo '5ff2720ff86a852e26f925f18e5a37a53644973329afcec0aee7b968e4a760af  mubel-kantar-r03/source.part04' | sha256sum -c -
          cat mubel-kantar-r03/source.part00 mubel-kantar-r03/source.part01 mubel-kantar-r03/source.part02 mubel-kantar-r03/source.part03a mubel-kantar-r03/source.part03b mubel-kantar-r03/source.part04 > /tmp/mubel-r03.b64
          echo '53da8ad3769647a1415801cca7b6daeb1753248d120120c0cb810d2a4fffd9cd  /tmp/mubel-r03.b64' | sha256sum -c -
          base64 -d /tmp/mubel-r03.b64 > /tmp/mubel-r03.tar.xz
          echo '4823fc53c933ba566ce3cf2bdd34e32db0a04f21cce8ff1040a42d5efc5e2d0a  /tmp/mubel-r03.tar.xz' | sha256sum -c -
          xz -t /tmp/mubel-r03.tar.xz
          rm -rf mubel-kantar-r03/project /tmp/mubel-r03-src
          mkdir -p mubel-kantar-r03/project /tmp/mubel-r03-src
          tar -xJf /tmp/mubel-r03.tar.xz -C /tmp/mubel-r03-src
          cp -a /tmp/mubel-r03-src/MUBEL_Kantar_Android_R03/. mubel-kantar-r03/project/
          printf 'android.useAndroidX=true\nandroid.enableJetifier=true\nandroid.suppressUnsupportedCompileSdk=36\n' > mubel-kantar-r03/project/gradle.properties
          grep -n "applicationId\|versionCode\|versionName" mubel-kantar-r03/project/app/build.gradle

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0' >/dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: mubel-kantar-r03/project
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify and stage APK
        shell: bash
        run: |
          APK='mubel-kantar-r03/project/app/build/outputs/apk/debug/app-debug.apk'
          test -f "$APK"
          unzip -t "$APK"
          mkdir -p mubel-kantar-r03/dist
          cp "$APK" mubel-kantar-r03/dist/MUBEL_KANTAR_UNIVERSAL_2.10.8-R03.apk
          sha256sum mubel-kantar-r03/dist/MUBEL_KANTAR_UNIVERSAL_2.10.8-R03.apk | tee mubel-kantar-r03/dist/SHA256.txt
          ls -lh mubel-kantar-r03/dist/MUBEL_KANTAR_UNIVERSAL_2.10.8-R03.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MUBEL_KANTAR_UNIVERSAL_2.10.8-R03
          path: |
            mubel-kantar-r03/dist/MUBEL_KANTAR_UNIVERSAL_2.10.8-R03.apk
            mubel-kantar-r03/dist/SHA256.txt
          if-no-files-found: error
          retention-days: 30
