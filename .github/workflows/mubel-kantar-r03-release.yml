name: MUBEL KANTAR UNIVERSAL 2.10.9-R04 APK

on:
  push:
    branches: [mubel-kantar-r04-release]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Extract R04 source
        shell: bash
        run: |
          rm -rf mubel-kantar-r04/project
          mkdir -p mubel-kantar-r04/project
          tar -xzf mubel-kantar-r04/source.tar.gz -C /tmp
          cp -a /tmp/MUBEL_Kantar_Android_R04/. mubel-kantar-r04/project/
          grep -n "applicationId\|versionCode\|versionName" mubel-kantar-r04/project/app/build.gradle

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: mubel-kantar-r04/project
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK archive
        shell: bash
        run: |
          APK='mubel-kantar-r04/project/app/build/outputs/apk/debug/app-debug.apk'
          test -f "$APK"
          unzip -t "$APK"
          mkdir -p mubel-kantar-r04/dist
          cp "$APK" mubel-kantar-r04/dist/MUBEL_KANTAR_UNIVERSAL_2.10.9-R04.apk
          sha256sum mubel-kantar-r04/dist/MUBEL_KANTAR_UNIVERSAL_2.10.9-R04.apk | tee mubel-kantar-r04/dist/SHA256.txt

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r mubel-kantar-r04/dist/MUBEL_KANTAR_UNIVERSAL_2.10.9-R04.apk
            adb logcat -c
            adb shell am start -W -n com.mubel.kantar.r04/.MainActivity
            sleep 5
            adb shell pidof com.mubel.kantar.r04
            adb shell dumpsys activity activities | grep -m1 'mResumedActivity.*com.mubel.kantar.r04' 
            if adb logcat -d '*:E' | grep -q 'FATAL EXCEPTION.*com.mubel.kantar.r04'; then adb logcat -d; exit 1; fi
            adb exec-out screencap -p > mubel-kantar-r04/dist/SMOKE_SCREEN.png
            adb shell am force-stop com.mubel.kantar.r04
            adb shell am start -W -n com.mubel.kantar.r04/.MainActivity
            sleep 3
            adb shell pidof com.mubel.kantar.r04

      - uses: actions/upload-artifact@v4
        with:
          name: MUBEL_KANTAR_UNIVERSAL_2.10.9-R04_TESTED
          path: |
            mubel-kantar-r04/dist/MUBEL_KANTAR_UNIVERSAL_2.10.9-R04.apk
            mubel-kantar-r04/dist/SHA256.txt
            mubel-kantar-r04/dist/SMOKE_SCREEN.png
          if-no-files-found: error
          retention-days: 30
