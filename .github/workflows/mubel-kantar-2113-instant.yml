name: MUBEL KANTAR 2.10.13 INSTANT CAMERA APK
on:
  push:
    branches: [mubel-kantar-2113-screenlock]
    paths: ['mubel-kantar-2113-instant/**','.github/workflows/mubel-kantar-2113-instant.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Preserve stable layers and add instant camera
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-2113 dist-2113
          cp -a extracted-2107/mubel_stable_triple build-2113
          python3 mubel-kantar-2108/patch_2108.py build-2113 mubel-kantar-2108
          python3 mubel-kantar-2109/patch_2109.py build-2113 mubel-kantar-2109
          python3 mubel-kantar-2111/patch_2111.py build-2113 mubel-kantar-2111
          python3 mubel-kantar-2112/patch_2112.py build-2113
          python3 mubel-kantar-2113-instant/patch_2113.py build-2113
          python3 mubel-kantar-2113-instant/patch_2113_v13.py build-2113
          python3 mubel-kantar-2113-instant/patch_2113_v14.py build-2113
          python3 mubel-kantar-2113-instant/patch_2113_v15.py build-2113
          python3 mubel-kantar-2113-instant/patch_2113_v16.py build-2113
          python3 mubel-kantar-2113-instant/patch_2113_v17.py build-2113
          python3 mubel-kantar-2113-instant/patch_2113_v18.py build-2113
          mkdir -p dist-2113
          cat >> build-2113/app/build.gradle <<'EOF'
          android { packaging { resources { excludes += ['META-INF/LICENSE.md','META-INF/LICENSE.txt','META-INF/NOTICE.md','META-INF/NOTICE.txt'] } } }
          EOF
      - name: Android SDK
        shell: bash
        run: |
          SDK='/usr/local/lib/android/sdk'; echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"; echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.10.2'}
      - name: Compile
        working-directory: build-2113
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          APK=build-2113/app/build/outputs/apk/debug/app-debug.apk
          OUT=dist-2113/MUBEL_KANTAR_2.10.13_INSTANT_CAMERA_STABIL.apk
          test -s "$APK"; cp "$APK" "$OUT"; unzip -t "$OUT"
          $ANDROID_HOME/build-tools/36.0.0/aapt2 dump badging "$OUT" > dist-2113/BADGING.txt
          grep -q "package: name='com.mubel.kantar.v2113instant'" dist-2113/BADGING.txt
          grep -q "versionCode='2113'" dist-2113/BADGING.txt
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose "$OUT" > dist-2113/SIGNATURE.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' dist-2113/SIGNATURE.txt
          sha256sum "$OUT" > dist-2113/SHA256.txt
      - uses: actions/upload-artifact@v4
        with: {name: MUBEL_KANTAR_2.10.13_INSTANT_CAMERA_STABIL, path: 'dist-2113/', retention-days: 30}
