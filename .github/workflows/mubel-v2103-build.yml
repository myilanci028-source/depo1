name: MUBEL KANTAR 2.10.6 STABIL + WIRELESS R01

on:
  push:
    branches: [mubel-v2107-wireless]
    paths:
      - 'mubel-v2103/project/**'
      - '.github/workflows/mubel-v2103-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: mubel-v2103/project
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK='mubel-v2103/project/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -t "$APK"
          mkdir -p mubel-v2103/dist
          cp "$APK" mubel-v2103/dist/MUBEL_KANTAR_2.10.6_STABIL_WIRELESS_R01.apk
          sha256sum mubel-v2103/dist/MUBEL_KANTAR_2.10.6_STABIL_WIRELESS_R01.apk | tee mubel-v2103/dist/SHA256.txt
          ls -lh mubel-v2103/dist/MUBEL_KANTAR_2.10.6_STABIL_WIRELESS_R01.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Android 15 install + launch + IR safety smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -eu
            REPORT='mubel-v2103/dist/SMOKE_REPORT.txt'
            APK='mubel-v2103/dist/MUBEL_KANTAR_2.10.6_STABIL_WIRELESS_R01.apk'
            PKG='com.mubel.kantar.v2106wireless'
            ACT='com.mubel.kantar.MainActivityWireless'
            echo '=== INSTALL ===' > "$REPORT"
            adb install -r "$APK" | tee -a "$REPORT"
            adb shell pm path "$PKG" | tee -a "$REPORT"
            adb logcat -c
            echo '=== COLD LAUNCH ===' | tee -a "$REPORT"
            adb shell am force-stop "$PKG"
            adb shell am start -W -n "$PKG/$ACT" | tee -a "$REPORT"
            sleep 6
            test -n "$(adb shell pidof "$PKG" | tr -d '\r')"
            adb exec-out screencap -p > mubel-v2103/dist/SCREEN_MAIN.png
            adb shell uiautomator dump /sdcard/u.xml >/dev/null
            adb pull /sdcard/u.xml /tmp/u.xml >/dev/null
            grep -q 'KABLOSUZ' /tmp/u.xml
            python3 - <<'PY'
            import re, subprocess, xml.etree.ElementTree as ET
            root=ET.parse('/tmp/u.xml').getroot()
            for n in root.iter('node'):
                if n.attrib.get('text')=='KABLOSUZ':
                    m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', n.attrib['bounds'])
                    x=(int(m.group(1))+int(m.group(3)))//2; y=(int(m.group(2))+int(m.group(4)))//2
                    subprocess.check_call(['adb','shell','input','tap',str(x),str(y)])
                    break
            else: raise SystemExit('KABLOSUZ button not found')
            PY
            sleep 2
            adb shell uiautomator dump /sdcard/w.xml >/dev/null
            adb pull /sdcard/w.xml /tmp/w.xml >/dev/null
            grep -q 'IR DONANIM TEST' /tmp/w.xml
            adb exec-out screencap -p > mubel-v2103/dist/SCREEN_WIRELESS.png
            python3 - <<'PY'
            import re, subprocess, xml.etree.ElementTree as ET
            root=ET.parse('/tmp/w.xml').getroot()
            for n in root.iter('node'):
                if n.attrib.get('text')=='IR DONANIM TEST':
                    m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', n.attrib['bounds'])
                    x=(int(m.group(1))+int(m.group(3)))//2; y=(int(m.group(2))+int(m.group(4)))//2
                    subprocess.check_call(['adb','shell','input','tap',str(x),str(y)])
                    break
            else: raise SystemExit('IR test button not found')
            PY
            sleep 2
            test -n "$(adb shell pidof "$PKG" | tr -d '\r')"
            adb shell uiautomator dump /sdcard/ir.xml >/dev/null
            adb pull /sdcard/ir.xml /tmp/ir.xml >/dev/null
            cp /tmp/ir.xml mubel-v2103/dist/UI_AFTER_IR.xml
            adb exec-out screencap -p > mubel-v2103/dist/SCREEN_IR_TEST.png
            if adb logcat -d | grep -E 'FATAL EXCEPTION|Process: com.mubel.kantar.v2106wireless|SecurityException.*TRANSMIT_IR'; then
              echo 'FAIL: crash/security error found' | tee -a "$REPORT"
              exit 1
            fi
            echo 'SMOKE_TEST=PASS' | tee -a "$REPORT"

      - uses: actions/upload-artifact@v4
        with:
          name: MUBEL_KANTAR_2.10.6_STABIL_WIRELESS_R01_TESTED
          path: |
            mubel-v2103/dist/MUBEL_KANTAR_2.10.6_STABIL_WIRELESS_R01.apk
            mubel-v2103/dist/SHA256.txt
            mubel-v2103/dist/SMOKE_REPORT.txt
            mubel-v2103/dist/SCREEN_MAIN.png
            mubel-v2103/dist/SCREEN_WIRELESS.png
            mubel-v2103/dist/SCREEN_IR_TEST.png
            mubel-v2103/dist/UI_AFTER_IR.xml
          if-no-files-found: error
          retention-days: 30
