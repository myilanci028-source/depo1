name: MUBEL KANTAR V2.10.6 FINAL A4 RESPONSE

on:
  push:
    branches: [mubel-v2106-final]
    paths:
      - 'mubel-v2103/project/**'
      - '.github/workflows/mubel-v2103-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: mubel-v2103/project
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          APK='mubel-v2103/project/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -t "$APK"
          mkdir -p mubel-v2103/dist
          cp "$APK" mubel-v2103/dist/MUBEL_KANTAR_v2.10.6_FINAL.apk
          ls -lh mubel-v2103/dist/MUBEL_KANTAR_v2.10.6_FINAL.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MUBEL_KANTAR_v2.10.6_FINAL
          path: mubel-v2103/dist/MUBEL_KANTAR_v2.10.6_FINAL.apk
          if-no-files-found: error
          retention-days: 30
