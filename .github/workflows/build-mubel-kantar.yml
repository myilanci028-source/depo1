name: Build MUBEL KANTAR v2.8 APK

on:
  push:
    branches: [mubel-kantar-v2-5-final]
    paths:
      - 'mubel-kantar/**'
      - '.github/workflows/build-mubel-kantar.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        working-directory: mubel-kantar
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Publish APK
        shell: bash
        run: |
          mkdir -p dist
          cp mubel-kantar/app/build/outputs/apk/debug/app-debug.apk dist/MUBEL_KANTAR_v2.8_FINAL.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/MUBEL_KANTAR_v2.8_FINAL.apk
          if ! git diff --cached --quiet; then
            git commit -m "Publish MUBEL KANTAR v2.8 FINAL APK [skip ci]"
            git push origin HEAD:mubel-kantar-v2-5-final
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: MUBEL_KANTAR_v2.8_FINAL
          path: dist/MUBEL_KANTAR_v2.8_FINAL.apk
          retention-days: 30
