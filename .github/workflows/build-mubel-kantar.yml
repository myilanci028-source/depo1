name: Build MUBEL KANTAR v2.10.3 APK

on:
  push:
    branches: [mubel-kantar-v2-5-final]
    paths:
      - 'mubel-kantar/**'
      - '.github/workflows/build-mubel-kantar.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Keep Android signing key stable
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: mubel-kantar-signing-v1
      - name: Ensure signing key exists
        shell: bash
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep -E 'SHA256:|Owner:' || true
      - name: Install SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Apply v2.10.3 fast PDF mail patch
        working-directory: mubel-kantar
        shell: bash
        run: |
          python patch_v2103.py
          sed -i "s/applicationId 'com.mubel.kantar.v2102'/applicationId 'com.mubel.kantar.v2103'/" app/build.gradle
          grep -E "applicationId|versionCode|versionName" app/build.gradle
      - name: Build APK
        working-directory: mubel-kantar
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Publish APK
        shell: bash
        run: |
          mkdir -p dist
          cp mubel-kantar/app/build/outputs/apk/debug/app-debug.apk dist/MUBEL_KANTAR_v2.10.3_FINAL.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/MUBEL_KANTAR_v2.10.3_FINAL.apk
          if ! git diff --cached --quiet; then
            git commit -m "Publish MUBEL KANTAR v2.10.3 FINAL APK [skip ci]"
            git push origin HEAD:mubel-kantar-v2-5-final
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: MUBEL_KANTAR_v2.10.3_FINAL
          path: dist/MUBEL_KANTAR_v2.10.3_FINAL.apk
          retention-days: 30
