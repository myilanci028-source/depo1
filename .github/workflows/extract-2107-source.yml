name: Extract MUBEL KANTAR 2.10.7 Stable Source

on:
  workflow_dispatch:
  push:
    branches: [mubel-kantar-2108-camera]
    paths:
      - '.github/workflows/extract-2107-source.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mubel-kantar-2108-camera
      - name: Rebuild verified stable source
        shell: bash
        run: |
          set -euo pipefail
          PARTS='mubel-kantar-stable-triple/parts2'
          cat "$PARTS"/source.part{00..20} > /tmp/mubel_stable_triple_source.b64
          echo '4e2b46d7c8a2089c646e37eec9b813957c3e7ef806145c3981ce21b4ac06627e  /tmp/mubel_stable_triple_source.b64' | sha256sum -c -
          base64 -d /tmp/mubel_stable_triple_source.b64 > /tmp/mubel_stable_triple_source.tar.gz
          echo '0a29a13adbbbc3cd3e07486dc444eb72c8011e66e18751a0bb4131173be012b6  /tmp/mubel_stable_triple_source.tar.gz' | sha256sum -c -
          gzip -t /tmp/mubel_stable_triple_source.tar.gz
          rm -rf extracted-2107
          mkdir extracted-2107
          tar -xzf /tmp/mubel_stable_triple_source.tar.gz -C extracted-2107
          find extracted-2107 -maxdepth 6 -type f | sort | head -300
      - name: Commit extracted source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extracted-2107
          git commit -m 'Extract MUBEL KANTAR 2.10.7 stable project' || exit 0
          git push origin HEAD:mubel-kantar-2108-camera
