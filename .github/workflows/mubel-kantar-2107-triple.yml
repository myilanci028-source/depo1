name: MUBEL KANTAR 2.10.6 STABLE + WIFI + BLUETOOTH + IR

on:
  push:
    branches: [mubel-kantar-2107-triple]
    paths:
      - 'mubel-kantar-stable-triple/**'
      - '.github/workflows/mubel-kantar-2107-triple.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild exact stable-based project
        shell: bash
        run: |
          set -euo pipefail
          test -s mubel-kantar-stable-triple/source.b64
          rm -rf /tmp/mubel_src mubel-kantar-stable-triple/project
          mkdir -p /tmp/mubel_src mubel-kantar-stable-triple/project
          base64 -d mubel-kantar-stable-triple/source.b64 > /tmp/source.tar.gz
          gzip -t /tmp/source.tar.gz
          tar -xzf /tmp/source.tar.gz -C /tmp/mubel_src
          cp -a /tmp/mubel_src/mubel_stable_triple/. mubel-kantar-stable-triple/project/

          # Two defensive fixes found before release: do not invalidate a fresh TCP generation,
          # and request Android 12+ Bluetooth permission before touching adapter state.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('mubel-kantar-stable-triple/project/app/src/main/java/com/mubel/kantar/MainActivity.java')
          s=p.read_text()
          s=s.replace('final int g = generation.incrementAndGet();\n        disconnectScale(false);', 'disconnectScale(false);\n        final int g = generation.incrementAndGet();')
          s=s.replace('BluetoothAdapter a=adapter(); if(a==null){tstatus("BT","HATA","Bu telefonda Bluetooth yok");return;} if(!a.isEnabled()){tstatus("BT","HATA","Bluetooth kapalı; telefondan açın");return;} if(!btPerms()){askBtPerms();tstatus("BT","İZİN","Bluetooth iznini verip TARA\'ya tekrar basın");return;}', 'BluetoothAdapter a=adapter(); if(a==null){tstatus("BT","HATA","Bu telefonda Bluetooth yok");return;} if(!btPerms()){askBtPerms();tstatus("BT","İZİN","Bluetooth iznini verip TARA\'ya tekrar basın");return;} if(!a.isEnabled()){tstatus("BT","HATA","Bluetooth kapalı; telefondan açın");return;}')
          p.write_text(s)
          PY

          grep -n "applicationId\|versionCode\|versionName" mubel-kantar-stable-triple/project/app/build.gradle
          grep -n "TRANSMIT_IR\|BLUETOOTH_SCAN\|BLUETOOTH_CONNECT" mubel-kantar-stable-triple/project/app/src/main/AndroidManifest.xml
          grep -q '<script src="v2106.js"></script>' mubel-kantar-stable-triple/project/app/src/main/assets/index.html
          grep -q '<script src="v2107.js"></script>' mubel-kantar-stable-triple/project/app/src/main/assets/index.html
          node --check mubel-kantar-stable-triple/project/app/src/main/assets/app.js
          node --check mubel-kantar-stable-triple/project/app/src/main/assets/v2106.js
          node --check mubel-kantar-stable-triple/project/app/src/main/assets/v2107.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0' >/dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: mubel-kantar-stable-triple/project
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK structure and triple permissions
        shell: bash
        run: |
          set -euo pipefail
          APK='mubel-kantar-stable-triple/project/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -t "$APK"
          mkdir -p mubel-kantar-stable-triple/dist
          OUT='mubel-kantar-stable-triple/dist/MUBEL_KANTAR_2.10.6_STABIL_WIFI_BLUETOOTH_IR.apk'
          cp "$APK" "$OUT"
          unzip -l "$OUT" > mubel-kantar-stable-triple/dist/APK_CONTENTS.txt
          grep -q 'assets/app.js' mubel-kantar-stable-triple/dist/APK_CONTENTS.txt
          grep -q 'assets/v2106.js' mubel-kantar-stable-triple/dist/APK_CONTENTS.txt
          grep -q 'assets/v2107.js' mubel-kantar-stable-triple/dist/APK_CONTENTS.txt
          $ANDROID_HOME/build-tools/36.0.0/aapt2 dump xmltree "$OUT" --file AndroidManifest.xml > mubel-kantar-stable-triple/dist/MANIFEST_DUMP.txt
          grep -q 'android.permission.TRANSMIT_IR' mubel-kantar-stable-triple/dist/MANIFEST_DUMP.txt
          grep -q 'android.permission.BLUETOOTH_SCAN' mubel-kantar-stable-triple/dist/MANIFEST_DUMP.txt
          grep -q 'android.permission.BLUETOOTH_CONNECT' mubel-kantar-stable-triple/dist/MANIFEST_DUMP.txt
          sha256sum "$OUT" | tee mubel-kantar-stable-triple/dist/SHA256.txt
          ls -lh "$OUT"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Android 16 install and double-launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -euo pipefail
            APK='mubel-kantar-stable-triple/dist/MUBEL_KANTAR_2.10.6_STABIL_WIFI_BLUETOOTH_IR.apk'
            PKG='com.mubel.kantar.v2107triple'
            ACT='com.mubel.kantar.MainActivity'
            REPORT='mubel-kantar-stable-triple/dist/SMOKE_REPORT.txt'
            echo '=== INSTALL ===' > "$REPORT"
            adb install -r "$APK" | tee -a "$REPORT"
            adb shell pm path "$PKG" | tee -a "$REPORT"
            echo '=== DECLARED PERMISSIONS ===' | tee -a "$REPORT"
            adb shell dumpsys package "$PKG" | grep -E 'TRANSMIT_IR|BLUETOOTH_SCAN|BLUETOOTH_CONNECT|INTERNET' | tee -a "$REPORT" || true

            echo '=== LAUNCH 1 ===' | tee -a "$REPORT"
            adb logcat -c
            adb shell am force-stop "$PKG"
            adb shell am start -W -n "$PKG/$ACT" | tee -a "$REPORT"
            sleep 6
            test -n "$(adb shell pidof "$PKG" | tr -d '\r')"
            if adb logcat -d | grep -q 'FATAL EXCEPTION'; then adb logcat -d >> "$REPORT"; exit 1; fi
            adb exec-out screencap -p > mubel-kantar-stable-triple/dist/SCREEN_1.png
            adb shell uiautomator dump /sdcard/window.xml >/dev/null || true
            adb pull /sdcard/window.xml mubel-kantar-stable-triple/dist/UI_1.xml >/dev/null || true

            echo '=== LAUNCH 2 ===' | tee -a "$REPORT"
            adb logcat -c
            adb shell am force-stop "$PKG"
            adb shell am start -W -n "$PKG/$ACT" | tee -a "$REPORT"
            sleep 6
            test -n "$(adb shell pidof "$PKG" | tr -d '\r')"
            if adb logcat -d | grep -q 'FATAL EXCEPTION'; then adb logcat -d >> "$REPORT"; exit 1; fi
            adb exec-out screencap -p > mubel-kantar-stable-triple/dist/SCREEN_2.png
            echo 'SMOKE_TEST=PASS' | tee -a "$REPORT"

      - uses: actions/upload-artifact@v4
        with:
          name: MUBEL_KANTAR_2.10.6_STABIL_WIFI_BLUETOOTH_IR_ANDROID16_TESTED
          path: |
            mubel-kantar-stable-triple/dist/MUBEL_KANTAR_2.10.6_STABIL_WIFI_BLUETOOTH_IR.apk
            mubel-kantar-stable-triple/dist/SHA256.txt
            mubel-kantar-stable-triple/dist/MANIFEST_DUMP.txt
            mubel-kantar-stable-triple/dist/APK_CONTENTS.txt
            mubel-kantar-stable-triple/dist/SMOKE_REPORT.txt
            mubel-kantar-stable-triple/dist/SCREEN_1.png
            mubel-kantar-stable-triple/dist/SCREEN_2.png
            mubel-kantar-stable-triple/dist/UI_1.xml
          if-no-files-found: error
          retention-days: 30
