name: MUBEL KANTAR 2.10.7 TRIPLE APK

on:
  push:
    branches: [mubel-kantar-2107-triple]
    paths:
      - 'mubel-kantar-2107/**'
      - '.github/workflows/mubel-kantar-2107-triple.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild and verify stable-based source
        shell: bash
        run: |
          set -euo pipefail
          echo 'c4add1b8af3184161c9e9c90170b7f49958ef650f6a3f607c123146c017187a9  mubel-kantar-2107/source.part00' | sha256sum -c -
          echo '3a12155564aa86c0b7dce6013f74a99a65eb6023dcf3376a17d4b3192e2d2244  mubel-kantar-2107/source.part01' | sha256sum -c -
          echo '6b9f2759b1eef3dcb88f618399ec9cb2a5506be522b75c727a9fc3eccec8a7ed  mubel-kantar-2107/source.part02' | sha256sum -c -
          echo '19fb0dafc23eb15185fc9b195561ddc11e2a73a8fa31f8f48f1e81cbe66423f1  mubel-kantar-2107/source.part03' | sha256sum -c -
          cat mubel-kantar-2107/source.part00 mubel-kantar-2107/source.part01 mubel-kantar-2107/source.part02 mubel-kantar-2107/source.part03 > /tmp/mubel2107.b64
          base64 -d /tmp/mubel2107.b64 > /tmp/mubel2107.tar.gz
          echo 'bb7d245826cd797996f83961b52700943de5c9be2c48b630a1497cb2b3177f69  /tmp/mubel2107.tar.gz' | sha256sum -c -
          tar -tzf /tmp/mubel2107.tar.gz >/dev/null
          rm -rf /tmp/mubel2107src mubel-kantar-2107/project
          mkdir -p /tmp/mubel2107src mubel-kantar-2107/project
          tar -xzf /tmp/mubel2107.tar.gz -C /tmp/mubel2107src
          cp -a /tmp/mubel2107src/MUBEL_KANTAR_2107_TRIPLE/. mubel-kantar-2107/project/
          grep -n "applicationId\|versionCode\|versionName" mubel-kantar-2107/project/app/build.gradle
          grep -n "TRANSMIT_IR\|BLUETOOTH_SCAN\|BLUETOOTH_CONNECT" mubel-kantar-2107/project/app/src/main/AndroidManifest.xml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0' >/dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: mubel-kantar-2107/project
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK and permissions
        shell: bash
        run: |
          set -euo pipefail
          APK='mubel-kantar-2107/project/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -t "$APK"
          mkdir -p mubel-kantar-2107/dist
          cp "$APK" mubel-kantar-2107/dist/MUBEL_KANTAR_2.10.7_KIZILOTESI_BLUETOOTH_WIFI.apk
          $ANDROID_HOME/build-tools/36.0.0/aapt2 dump xmltree "$APK" --file AndroidManifest.xml > mubel-kantar-2107/dist/MANIFEST_DUMP.txt
          grep -q 'android.permission.TRANSMIT_IR' mubel-kantar-2107/dist/MANIFEST_DUMP.txt
          grep -q 'android.permission.BLUETOOTH_SCAN' mubel-kantar-2107/dist/MANIFEST_DUMP.txt
          grep -q 'android.permission.BLUETOOTH_CONNECT' mubel-kantar-2107/dist/MANIFEST_DUMP.txt
          sha256sum mubel-kantar-2107/dist/MUBEL_KANTAR_2.10.7_KIZILOTESI_BLUETOOTH_WIFI.apk | tee mubel-kantar-2107/dist/SHA256.txt

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Android 16 install and double-launch test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -e
            APK='mubel-kantar-2107/dist/MUBEL_KANTAR_2.10.7_KIZILOTESI_BLUETOOTH_WIFI.apk'
            echo '=== INSTALL ===' > mubel-kantar-2107/dist/SMOKE_REPORT.txt
            adb install -r "$APK" | tee -a mubel-kantar-2107/dist/SMOKE_REPORT.txt
            adb shell pm path com.mubel.kantar.triple | tee -a mubel-kantar-2107/dist/SMOKE_REPORT.txt
            echo '=== DECLARED PERMISSIONS ===' | tee -a mubel-kantar-2107/dist/SMOKE_REPORT.txt
            adb shell dumpsys package com.mubel.kantar.triple | grep -E 'TRANSMIT_IR|BLUETOOTH_SCAN|BLUETOOTH_CONNECT|INTERNET' | tee -a mubel-kantar-2107/dist/SMOKE_REPORT.txt || true
            echo '=== LAUNCH 1 ===' | tee -a mubel-kantar-2107/dist/SMOKE_REPORT.txt
            adb logcat -c
            adb shell am force-stop com.mubel.kantar.triple
            adb shell am start -W -n com.mubel.kantar.triple/.MainActivity | tee -a mubel-kantar-2107/dist/SMOKE_REPORT.txt
            sleep 5
            test -n "$(adb shell pidof com.mubel.kantar.triple | tr -d '\r')"
            ! adb logcat -d | grep -q 'FATAL EXCEPTION'
            adb exec-out screencap -p > mubel-kantar-2107/dist/SCREEN_1.png
            echo '=== LAUNCH 2 ===' | tee -a mubel-kantar-2107/dist/SMOKE_REPORT.txt
            adb shell am force-stop com.mubel.kantar.triple
            adb shell am start -W -n com.mubel.kantar.triple/.MainActivity | tee -a mubel-kantar-2107/dist/SMOKE_REPORT.txt
            sleep 5
            test -n "$(adb shell pidof com.mubel.kantar.triple | tr -d '\r')"
            ! adb logcat -d | grep -q 'FATAL EXCEPTION'
            adb exec-out screencap -p > mubel-kantar-2107/dist/SCREEN_2.png
            echo 'SMOKE_TEST=PASS' | tee -a mubel-kantar-2107/dist/SMOKE_REPORT.txt

      - uses: actions/upload-artifact@v4
        with:
          name: MUBEL_KANTAR_2.10.7_TRIPLE_ANDROID16_TESTED
          path: |
            mubel-kantar-2107/dist/MUBEL_KANTAR_2.10.7_KIZILOTESI_BLUETOOTH_WIFI.apk
            mubel-kantar-2107/dist/SHA256.txt
            mubel-kantar-2107/dist/MANIFEST_DUMP.txt
            mubel-kantar-2107/dist/SMOKE_REPORT.txt
            mubel-kantar-2107/dist/SCREEN_1.png
            mubel-kantar-2107/dist/SCREEN_2.png
          if-no-files-found: error
          retention-days: 30
