plugins { id 'com.android.application' }

android {
    namespace 'com.mubel.kantar'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mubel.kantar.v2103'
        minSdk 23
        targetSdk 35
        versionCode 2103
        versionName '2.10.3'
    }

    packaging {
        resources {
            excludes += ['META-INF/LICENSE*','META-INF/NOTICE*','META-INF/DEPENDENCIES','META-INF/*.kotlin_module']
        }
    }
}

dependencies {
    implementation 'com.sun.mail:android-mail:1.6.7'
    implementation 'com.sun.mail:android-activation:1.6.7'
}
