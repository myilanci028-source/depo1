plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mubel.kantar'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mubel.kantar.final.onepage'
        minSdk 23
        targetSdk 35
        versionCode 251
        versionName '2.5.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
